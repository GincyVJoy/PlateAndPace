<style>
:root{
  --bg:#EEF3F1;--surface:#FFFFFF;--ink:#2A1B3D;--muted:#6B6078;--line:#D9E2DE;
  --green:#1F7A5A;--green-soft:#D5EBE2;--blush:#F4C6D0;--blush-ink:#7A2C45;--warn:#B4472B;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15111C;--surface:#211A2C;--ink:#F1EAF7;--muted:#A99BB9;--line:#3A2F4A;
    --green:#5BC9A0;--green-soft:#1F3A33;--blush:#4A2634;--blush-ink:#F2B6C8;--warn:#F0937A;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#15111C;--surface:#211A2C;--ink:#F1EAF7;--muted:#A99BB9;--line:#3A2F4A;
  --green:#5BC9A0;--green-soft:#1F3A33;--blush:#4A2634;--blush-ink:#F2B6C8;--warn:#F0937A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 90px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15}
h1{font-size:1.7rem}h2{font-size:1.25rem;margin-bottom:10px}h3{font-size:1.05rem}
.sub{color:var(--muted);margin:2px 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card.blush{background:var(--blush);border-color:transparent;color:var(--blush-ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav a{flex:1;max-width:200px;text-align:center;text-decoration:none;color:var(--muted);padding:9px 6px;border-radius:12px;font-weight:600;font-size:.95rem}
nav a.on{background:var(--green-soft);color:var(--green)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:120px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer;background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#0F2A22}}
:root[data-theme="dark"] button{color:#0F2A22}
button.ghost{background:var(--green-soft);color:var(--green)}
button.tiny{min-height:34px;padding:4px 10px;font-size:.85rem}
button.x{background:transparent;color:var(--muted);min-height:34px;padding:2px 8px}
.ringbox{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;width:170px;height:170px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--head);font-weight:700;font-size:2.1rem;line-height:1}
.ring .small{font-size:.8rem;color:var(--muted)}
.macros{flex:1;min-width:200px}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:3px 0 10px}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.bar i.b{background:#6C8EBF}.bar i.o{background:#E0A24A}.bar i.w{background:var(--warn)}
.mrow{display:flex;justify-content:space-between;font-size:.9rem}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.items li:last-child{border:0}
.meta{color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:36px;font-weight:500}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#0F2A22}}
:root[data-theme="dark"] .chip.on{color:#0F2A22}
.tag{display:inline-block;background:var(--blush);color:var(--blush-ink);border-radius:8px;padding:1px 8px;font-size:.8rem;font-weight:600}
.tag.g{background:var(--green-soft);color:var(--green)}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.shop{background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.92rem}
.warn{color:var(--warn)}
.nav-day{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
ul.plain{padding-left:18px;margin:6px 0}
</style>
</head>

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shiftDay(key,n){var p=key.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function allFoods(){return FOODS.concat(custom)}
function food(name){return allFoods().find(function(x){return x.n===name})}
function mk(name,g,meal){var f=food(name);var r=g/100;return{n:name,g:g,k:Math.round(f.k*r),p:+(f.p*r).toFixed(1),c:+(f.c*r).toFixed(1),f:+(f.f*r).toFixed(1),m:meal}}

function allMeals(){return MEALS.concat(saved)}

function targets(){
  var bmr=10*profile.w+6.25*profile.h-5*profile.age+(profile.sex==='F'?-161:5);
  var tdee=bmr*profile.act;
  var floor=profile.sex==='F'?1200:1500;
  var target=Math.max(floor,Math.round((tdee-450)/10)*10);
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),target:target,deficit:Math.round(tdee-target),
    protein:Math.round(1.5*profile.w),water:Math.round((35*profile.w+(profile.act>=1.55?500:0))/50)*50};
}
function dayLog(){if(!logs[day])logs[day]={items:[],water:0};return logs[day]}
function totals(){var t={k:0,p:0,c:0,f:0};dayLog().items.forEach(function(i){t.k+=i.k;t.p+=i.p;t.c+=i.c;t.f+=i.f});return t}

  if(!picked||!food(picked)||!(g>0)){document.getElementById('ferr').textContent='Search and tap a food, then enter grams (or pieces for foods that show it).';return}
  var it=mk(picked,g,document.getElementById('meal').value);
  if(toBasket)basket.push(it);else{dayLog().items.push(it);save('logs',logs)}
  render();
}
function searchFood(){
  var box=document.getElementById('fres');if(!box)return;
  var raw=document.getElementById('fq').value.trim().toLowerCase();
  var stop=['with','and','plus','of','the','mit','und'];
  var toks=raw.split(/[^a-zäöüß0-9]+/).filter(function(t){return t&&stop.indexOf(t)<0});
  var m;
  if(!toks.length)m=allFoods().slice(0,10);
  else m=allFoods().map(function(f){
    var hay=(f.n+' '+f.de).toLowerCase(),hs=hay.replace(/[^a-zäöüß0-9]/g,''),sc=0;
    toks.forEach(function(t){if(hay.indexOf(t)>-1||hs.indexOf(t)>-1)sc++});
    return{f:f,sc:sc};
  }).filter(function(x){return x.sc>0}).sort(function(a,b){return b.sc-a.sc}).slice(0,12).map(function(x){return x.f});
  var tip=toks.length>1&&m.length?'<span class="meta" style="flex-basis:100%">Several foods typed. Tap one at a time, enter grams or pieces, then use “Add to meal basket”.</span>':'';
  box.innerHTML=m.length?tip+m.map(function(f){return'<button class="chip '+(f.n===picked?'on':'')+'" data-n="'+esc(f.n)+'" onclick="pick(this.dataset.n)">'+esc(f.n)+'</button>'}).join(''):'<span class="meta">No match. Try Open Food Facts below.</span>';
}
function pick(n){picked=n;hintFor();searchFood();var g=document.getElementById('fg');if(g)g.focus()}
function logBasket(){
  var meal=document.getElementById('meal').value;
  basket.forEach(function(x){var y=Object.assign({},x);y.m=meal;dayLog().items.push(y)});basket=[];save('logs',logs);render();
}
function delBasket(i){basket.splice(i,1);render()}
function clearBasket(){basket=[];render()}
function saveMeal(){
  var n=document.getElementById('bn').value.trim();
  if(!n){document.getElementById('berr').textContent='Give the meal a name first.';return}
  saved.push({t:n,s:1,i:basket.map(function(x){return[x.n,x.g]})});save('meals',saved);basket=[];render();
}
function delMeal(i){saved.splice(i,1);save('meals',saved);render()}
function basketHtml(){
  if(!basket.length)return'<div class="card"><h2>Meal basket</h2><p class="meta">Combine foods eaten together, such as apple + cornflakes + Skyr. Tap “Add to meal basket” for each food, then log the whole meal or save it for next time.</p></div>';
  var k=0,p=0;basket.forEach(function(x){k+=x.k;p+=x.p});
  return'<div class="card"><h2>Meal basket</h2><ul class="items">'+basket.map(function(x,i){return'<li><span>'+esc(x.n)+'<br><span class="meta">'+x.g+' g</span></span><span><b>'+x.k+'</b> kcal <button class="x" onclick="delBasket('+i+')" aria-label="Remove '+esc(x.n)+'">✕</button></span></li>'}).join('')+'</ul>'+
   '<p><b>Total: '+k+' kcal · '+Math.round(p)+' g protein</b></p><div class="row"><button onclick="logBasket()">Log whole basket</button><button class="x" onclick="clearBasket()">Clear</button></div>'+
   '<div class="row" style="margin-top:10px"><div class="grow" style="flex:2 1 200px"><label for="bn">Save as my meal</label><input id="bn" placeholder="e.g. Apple, cornflakes and Skyr"></div><button class="ghost" onclick="saveMeal()">Save meal</button></div><div class="warn" id="berr"></div></div>';
}
var offRes=[];
function r1(v){return Math.round((Number(v)||0)*10)/10}
async function searchOFF(){
  var q=document.getElementById('fq').value.trim(),box=document.getElementById('lres');
  if(!q){box.innerHTML='<span class="warn">Type a food name in the search box first.</span>';return}
  box.textContent='Searching…';
  try{
    var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},12000);
    var res=await fetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=15&fields=product_name,brands,nutriments',{signal:ctl.signal});
    clearTimeout(tm);
    if(!res.ok)throw new Error('http');
    var d=await res.json();
    offRes=(d.products||[]).map(function(p){
      var n=p.nutriments||{};var kc=n['energy-kcal_100g'];
      if(kc==null&&n['energy_100g']!=null)kc=n['energy_100g']/4.184;
      return{name:p.product_name,brand:(p.brands||'').split(',')[0].trim(),k:kc,p:n.proteins_100g,c:n.carbohydrates_100g,f:n.fat_100g};
    }).filter(function(x){return x.name&&x.k!=null&&isFinite(x.k)}).slice(0,8);
    if(!offRes.length){box.textContent='No products with calorie data found. Try another word, or use “Add your own food”.';return}
    box.innerHTML='<ul class="items">'+offRes.map(function(x,i){return'<li><span>'+esc(x.name)+(x.brand?' <span class="meta">('+esc(x.brand)+')</span>':'')+'<br><span class="meta">'+Math.round(x.k)+' kcal · '+r1(x.p)+' g protein per 100 g</span></span><button class="ghost tiny" onclick="useOFF('+i+')">Use</button></li>'}).join('')+'</ul>';
  }catch(e){
    box.textContent='Could not reach Open Food Facts. Check your internet connection and try again, or use “Add your own food”.';
  }
}
function useOFF(i){
  var x=offRes[i];if(!x)return;
  var name=x.name+(x.brand?' ('+x.brand+')':'');
  if(!food(name)){custom.push({n:name,de:'Open Food Facts',k:Math.round(x.k),p:r1(x.p),c:r1(x.c),f:r1(x.f),h:'From Open Food Facts, check your pack'});save('custom',custom)}
  picked=name;render();
}
function addMeal(i){
  var meal=document.getElementById('meal').value;
  allMeals()[i].i.forEach(function(x){dayLog().items.push(mk(x[0],x[1],meal))});save('logs',logs);render();
}
function delItem(i){dayLog().items.splice(i,1);save('logs',logs);render()}
function water(ml){var d=dayLog();d.water=Math.max(0,d.water+ml);save('logs',logs);render()}
function goDay(n){day=shiftDay(day,n);if(day>today())day=today();render()}
function addCustom(){
  var g=function(id){return document.getElementById(id).value};
  var n=g('cn').trim(),k=parseFloat(g('ck'));
  if(!n||!(k>=0)){document.getElementById('cerr').textContent='Add a name and kcal per 100 g.';return}
  custom.push({n:n,de:'my food',k:k,p:parseFloat(g('cp'))||0,c:parseFloat(g('cc'))||0,f:parseFloat(g('cf'))||0,h:'Added by you'});
  save('custom',custom);render();
}
function saveProfile(){
  var g=function(id){return document.getElementById(id).value};
  var np={age:+g('pa'),sex:g('ps'),h:+g('ph'),w:+g('pw'),goal:+g('pg'),act:+g('pact')};
  if(!(np.age>=18&&np.age<=80&&np.h>=120&&np.h<=220&&np.w>=35&&np.w<=250&&np.goal>=35&&np.goal<=250)){
    document.getElementById('perr').textContent='Please check the numbers (age 18–80, height in cm, weight in kg).';return}
  profile=np;save('profile',profile);render();
}
function togglePantry(k){var i=pantry.indexOf(k);if(i>-1)pantry.splice(i,1);else pantry.push(k);save('pantry',pantry);render()}
function hintFor(){var el=document.getElementById('fhint');if(!el)return;var f=picked&&food(picked);el.textContent=f?'Selected: '+f.n+' · '+f.k+' kcal per 100 g'+(f.h?' · '+f.h:'')+(f.u?' · type pieces or grams':''):'Tap a food below the search box.'}

/* ---------- views ---------- */
function advice(tg,t,wml){
  var out=[],items=dayLog().items;
  if(!items.length){out.push('Log your first meal to get tailored tips. Start with breakfast.');}
  else{
    if(t.k>tg.target)out.push('You are <b>'+(t.k-tg.target)+' kcal over</b> your target. Keep the next meal light: vegetables, a palm of protein, and a smaller portion of rice or chapati.');
    if(t.k>tg.target*0.5&&t.p<tg.protein*0.5)out.push('Protein is low for this point of the day ('+Math.round(t.p)+' g of '+tg.protein+' g). Add chicken, eggs, soya chunks, moong, Skyr or Magerquark.');
    if(t.k>200&&t.c*4/t.k>0.58)out.push('Carbs make up most of your calories. Halve the rice or chapati portion and double the vegetables.');
    if(t.k>200&&t.f*9/t.k>0.38)out.push('Fat is high. Check cooking oil, peanut butter and chocolate: 1 tsp of oil is about 45 kcal.');
  }
  if(day===today()&&new Date().getHours()>=12&&wml<tg.water*0.4)out.push('Water is behind. Drink a big glass now.');
  if(!out.length)out.push('You are on track. Keep portions steady and finish your water.');
  out.push('On Zumba days (17:00): eat a small carb snack around 15:30, such as a banana or a little muesli with milk, then have protein within 1–2 hours after class.');
  return out;
}
function viewToday(){
  var tg=targets(),t=totals(),d=dayLog(),rem=tg.target-t.k;
  var pct=Math.min(1,t.k/tg.target),C=2*Math.PI*70;
  var title=day===today()?'Today':day;
  var meals=['Breakfast','Lunch','Snack','Dinner'];
  var h='<div class="nav-day"><button class="ghost tiny" onclick="goDay(-1)" aria-label="Previous day">‹ Previous</button><h1>'+title+'</h1><button class="ghost tiny" onclick="goDay(1)" '+(day===today()?'disabled style="opacity:.4"':'')+' aria-label="Next day">Next ›</button></div>';
  h+='<div class="card"><div class="ringbox"><div class="ring"><svg width="170" height="170" viewBox="0 0 170 170"><circle cx="85" cy="85" r="70" fill="none" stroke="var(--bg)" stroke-width="14"/><circle cx="85" cy="85" r="70" fill="none" stroke="'+(rem<0?'var(--warn)':'var(--green)')+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+(C*pct)+' '+C+'"/></svg><div class="mid"><div class="big">'+Math.abs(rem)+'</div><div class="small">kcal '+(rem<0?'over':'left')+'</div></div></div>';
  h+='<div class="macros"><div class="mrow"><span>Eaten</span><b>'+t.k+' / '+tg.target+' kcal</b></div><div class="bar"><i class="'+(rem<0?'w':'')+'" style="width:'+(pct*100)+'%"></i></div>';
  h+='<div class="mrow"><span>Protein</span><b>'+Math.round(t.p)+' / '+tg.protein+' g</b></div><div class="bar"><i class="b" style="width:'+Math.min(100,t.p/tg.protein*100)+'%"></i></div>';
  h+='<div class="mrow"><span>Carbs</span><b>'+Math.round(t.c)+' g</b></div><div class="mrow"><span>Fat</span><b>'+Math.round(t.f)+' g</b></div></div></div></div>';
  var wp=Math.min(100,d.water/tg.water*100);
  h+='<div class="card"><h2>Water</h2><div class="mrow"><span>'+(d.water/1000).toFixed(2)+' L</span><b>goal '+(tg.water/1000).toFixed(2)+' L</b></div><div class="bar"><i class="b" style="width:'+wp+'%"></i></div><div class="row"><button class="ghost" onclick="water(250)">+ glass (250 ml)</button><button class="ghost" onclick="water(500)">+ bottle (500 ml)</button><button class="x" onclick="water(-250)" aria-label="Remove 250 ml">− 250</button></div></div>';
  h+='<div class="card"><h2>Add food</h2><label for="fq">Search food (English or German)</label><input id="fq" type="search" autocomplete="off" placeholder="e.g. cornflakes, Haferflocken, paneer" oninput="searchFood()"><div id="fres" class="chips" style="margin-top:8px"></div><div class="hint" id="fhint"></div>'+
    '<div class="row" style="margin-top:10px"><div class="grow"><label for="fp">Pieces (optional)</label><input id="fp" type="number" inputmode="decimal" min="0.5" step="0.5" placeholder="e.g. 3 idli"></div><div class="grow"><label for="fg">Grams</label><input id="fg" type="number" inputmode="decimal" min="1" placeholder="e.g. 150"></div><div class="grow"><label for="meal">Meal</label><select id="meal">'+meals.map(function(m){return'<option>'+m+'</option>'}).join('')+'</select></div></div>'+
    '<div class="row" style="margin-top:10px"><button onclick="addFood(false)">Log now</button><button class="ghost" onclick="addFood(true)">Add to meal basket</button></div><div class="warn" id="ferr" style="margin-top:6px"></div>'+
    '<details style="margin-top:12px"><summary>Not in the list? Search Open Food Facts</summary><p class="hint">Searches a free online database of packaged foods and fills in calories per 100 g. Needs internet. The data is entered by the community, so compare with your pack.</p><button class="ghost" onclick="searchOFF()">Search what I typed</button><div id="lres" style="margin-top:8px"></div></details>'+
    '<details style="margin-top:8px"><summary>Add your own food</summary><div class="row"><div class="grow" style="flex:2 1 200px"><label for="cn">Name</label><input id="cn"></div><div class="grow"><label for="ck">kcal /100 g</label><input id="ck" type="number" inputmode="decimal"></div></div><div class="row" style="margin-top:8px"><div class="grow"><label for="cp">Protein g</label><input id="cp" type="number" inputmode="decimal"></div><div class="grow"><label for="cc">Carbs g</label><input id="cc" type="number" inputmode="decimal"></div><div class="grow"><label for="cf">Fat g</label><input id="cf" type="number" inputmode="decimal"></div></div><div class="row" style="margin-top:10px"><button class="ghost" onclick="addCustom()">Save food</button><span class="warn" id="cerr"></span></div><div class="hint">Values are per 100 g, as printed on the German “Nährwerte” label.</div></details></div>';
  h+=basketHtml();
  h+='<div class="card"><h2>Food log</h2>';
  if(!d.items.length)h+='<p class="meta">Nothing logged yet. Add your first meal above.</p>';
  else meals.forEach(function(m){
    var li=d.items.map(function(x,i){return{x:x,i:i}}).filter(function(o){return o.x.m===m});
    if(!li.length)return;
    h+='<h3 style="margin-top:8px">'+m+' <span class="meta">'+li.reduce(function(s,o){return s+o.x.k},0)+' kcal</span></h3><ul class="items">'+
      li.map(function(o){return'<li><span>'+esc(o.x.n)+'<br><span class="meta">'+o.x.g+' g · '+o.x.p+' g protein</span></span><span><b>'+o.x.k+'</b> kcal <button class="x" onclick="delItem('+o.i+')" aria-label="Delete '+esc(o.x.n)+'">✕</button></span></li>'}).join('')+'</ul>';
  });
  h+='</div>';
  h+='<div class="card blush"><h2>Advice for this day</h2><ul class="plain">'+advice(tg,t,d.water).map(function(a){return'<li>'+a+'</li>'}).join('')+'</ul></div>';
  h+='<div class="card"><h2>Meal ideas and your saved meals</h2><p class="meta">Chosen meal slot above is used when you log. '+(rem>0?'You have about '+rem+' kcal left.':'You are at or above target.')+'</p><ul class="items">'+
    allMeals().map(function(m,i){var k=m.i.reduce(function(s,x){return s+mk(x[0],x[1],'').k},0);var p=Math.round(m.i.reduce(function(s,x){return s+mk(x[0],x[1],'').p},0));
      return'<li><span><b>'+esc(m.t)+'</b> '+(m.s?'<span class="tag">yours</span> ':'')+(k<=rem+30?'<span class="tag g">fits</span>':'')+'<br><span class="meta">'+m.i.map(function(x){return x[1]+' g '+x[0].toLowerCase()}).join(', ')+'</span><br><span class="meta">≈ '+k+' kcal · '+p+' g protein</span></span><span><button class="ghost tiny" onclick="addMeal('+i+')">Log</button>'+(i>=MEALS.length?' <button class="x" onclick="delMeal('+(i-MEALS.length)+')" aria-label="Delete saved meal">✕</button>':'')+'</span></li>'}).join('')+'</ul></div>';
  h+='<div class="card"><details><summary>What to limit (and easy swaps in Germany)</summary><ul class="plain"><li>Sweet drinks and juice (Saft, Limo, Cola): swap for water, Sprudel or tea with stevia.</li><li>Pastries and white rolls (Croissant, Brötchen, Brezel): swap for Vollkornbrot or a chapati.</li><li>Sweetened muesli and cereals: choose “ohne Zuckerzusatz” and measure 40 g.</li><li>Fried and oily curries: measure oil by the teaspoon.</li><li>Large rice portions: cap at about 150 g cooked, then add vegetables.</li><li>Sweets bought on impulse: use the Cravings tab for a planned alternative.</li></ul></details></div>';
  return h;
}
function viewCravings(){
  var h='<h1>Sugar cravings</h1><p class="sub">Tap what you have at home. Recipes you can make now come first.</p>';
  h+='<div class="card"><h2>At home</h2><div class="chips">'+PANTRY.map(function(p){return'<button class="chip '+(pantry.indexOf(p[0])>-1?'on':'')+'" onclick="togglePantry(\''+p[0]+'\')" aria-pressed="'+(pantry.indexOf(p[0])>-1)+'">'+p[1]+'</button>'}).join('')+'</div></div>';
  var list=RECIPES.map(function(r){return{r:r,miss:r.need.filter(function(k){return pantry.indexOf(k)<0})}}).sort(function(a,b){return a.miss.length-b.miss.length});
  list.forEach(function(o){
    var r=o.r;
    h+='<div class="card"><h3>'+r.t+'</h3><div class="meta">'+r.k+'</div><div style="margin:8px 0">'+
      (o.miss.length?'<span class="tag">Need '+o.miss.length+' more</span>':'<span class="tag g">You can make this now</span>')+'</div>';
    if(o.miss.length){h+='<div class="shop"><b>Buy in Munich:</b><ul class="plain">'+o.miss.map(function(k){var n=PANTRY.find(function(p){return p[0]===k});return'<li>'+n[1]+' — '+SHOP[k]+'</li>'}).join('')+'</ul></div>'}
    h+='<details><summary>Ingredients and steps</summary><ul class="plain">'+r.ing.map(function(i){return'<li>'+i[1]+(pantry.indexOf(i[0])>-1?' <span class="meta">(have)</span>':'')+'</li>'}).join('')+'</ul><ol class="plain">'+r.steps.map(function(s){return'<li>'+s+'</li>'}).join('')+'</ol></details></div>';
  });
  h+='<div class="card"><h3>Before you eat: a quick craving check</h3><ul class="plain"><li>Drink a glass of water and wait 10–15 minutes.</li><li>Have 20–25 g of protein if you skipped a meal. Skyr or eggs work well.</li><li>Choose one planned sweet portion rather than eating from the packet.</li></ul><p class="hint">Store hints are typical, not guaranteed. Stock varies by shop, so check your nearest branch.</p></div>';
  return h;
}
function viewPlan(){
  var tg=targets(),diff=profile.w-profile.goal,wk=tg.deficit*7/7700;
  var h='<h1>My plan</h1><p class="sub">Targets are estimates calculated from your details.</p>';
  h+='<div class="card"><h2>Your daily targets</h2><div class="row"><div class="grow"><div class="meta">Calories</div><h1>'+tg.target+'</h1></div><div class="grow"><div class="meta">Protein</div><h1>'+tg.protein+' g</h1></div><div class="grow"><div class="meta">Water</div><h1>'+(tg.water/1000).toFixed(1)+' L</h1></div></div>'+
   '<p class="hint">Resting burn ≈ '+tg.bmr+' kcal. With your activity, you burn ≈ '+tg.tdee+' kcal a day. Target is about '+tg.deficit+' kcal below that.'+
   (diff>0?' At that pace, expect roughly '+wk.toFixed(1)+' kg a week, so about '+Math.round(diff/wk)+' weeks to lose '+diff+' kg.':'')+'</p></div>';
  var acts=[[1.2,'Mostly sitting, no exercise'],[1.375,'Light: exercise 1–3 days a week'],[1.55,'Moderate: exercise 4–5 days a week (Zumba 5×)'],[1.725,'Very active: hard exercise most days']];
  h+='<div class="card"><h2>Your details</h2><div class="row"><div class="grow"><label for="pa">Age</label><input id="pa" type="number" value="'+profile.age+'"></div><div class="grow"><label for="ps">Sex</label><select id="ps"><option value="F"'+(profile.sex==='F'?' selected':'')+'>Female</option><option value="M"'+(profile.sex==='M'?' selected':'')+'>Male</option></select></div></div>'+
   '<div class="row" style="margin-top:8px"><div class="grow"><label for="ph">Height (cm)</label><input id="ph" type="number" value="'+profile.h+'"></div><div class="grow"><label for="pw">Weight (kg)</label><input id="pw" type="number" step="0.1" value="'+profile.w+'"></div><div class="grow"><label for="pg">Goal (kg)</label><input id="pg" type="number" step="0.1" value="'+profile.goal+'"></div></div>'+
   '<div style="margin-top:8px"><label for="pact">Activity</label><select id="pact">'+acts.map(function(a){return'<option value="'+a[0]+'"'+(a[0]===profile.act?' selected':'')+'>'+a[1]+'</option>'}).join('')+'</select></div>'+
   '<div class="row" style="margin-top:12px"><button onclick="saveProfile()">Save and recalculate</button><span class="warn" id="perr"></span></div><div class="hint">Update your weight every week or two so the targets stay accurate.</div></div>';
  h+='<div class="card"><h2>Good to know</h2><ul class="plain"><li>Calories use the Mifflin-St Jeor formula with a moderate deficit and a safe minimum of '+(profile.sex==='F'?1200:1500)+' kcal.</li><li>These are estimates, not medical advice. If you have diabetes, thyroid issues, are pregnant or breastfeeding, or have a history of disordered eating, speak to your doctor first.</li><li>Your data stays in this browser on this device only.</li></ul></div>';
  return h;
}
function render(){
  var r=(location.hash||'#today').slice(1);if(['today','cravings','plan'].indexOf(r)<0)r='today';
  document.getElementById('app').innerHTML=r==='today'?viewToday():r==='cravings'?viewCravings():viewPlan();
  ['today','cravings','plan'].forEach(function(k){var a=document.getElementById('n-'+k);a.className=k===r?'on':'';if(k===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(r==='today'){hintFor();searchFood()}
}
window.addEventListener('hashchange',function(){window.scrollTo(0,0);render()});
render();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
